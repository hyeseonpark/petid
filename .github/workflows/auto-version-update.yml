name: Auto Version Update

on:
  issue_comment:
    types: [created]

jobs:
  version-update:
    if: ${{
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, 'run version update') &&
        github.event.comment.user.login == github.event.issue.user.login
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: PR 정보 가져오기
        id: get_pr_info
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: PR 베이스 브랜치 확인 및 버전 추출
        id: check_branch_and_extract
        run: |
          PR_TITLE=$(echo '${{ steps.get_pr_info.outputs.data }}' | jq -r '.title')
          BASE_REF=$(echo '${{ steps.get_pr_info.outputs.data }}' | jq -r '.base.ref')
          
          if [[ "$BASE_REF" != "release" ]]; then
            echo "This PR is not targeting the release branch"
            exit 1
          fi
          
          VERSION="patch"  # 기본값: patch
          
          if [[ "$PR_TITLE" =~ version=major ]]; then
            VERSION="major"
          elif [[ "$PR_TITLE" =~ version=minor ]]; then
            VERSION="minor"
          fi
          
          echo "versioning=$VERSION" >> $GITHUB_ENV
          echo "versioning=$VERSION"
          
      - name: 체크아웃 (develop 브랜치)
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 저장된 LOCAL_PROPERTIES 파일을 local.properties로 작성
        run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties
        
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Gradle 실행 (버전 업데이트)
        run: ./gradlew versionUp --versioning=${{ env.versioning }}
        
      - name: 변경 사항 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "버전 업데이트 (${{ env.versioning }})"
          git push origin develop
