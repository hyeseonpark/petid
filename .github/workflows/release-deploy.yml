name: Build and release aab

on:
  pull_request:
    branches: [ release ]
    types: [ closed ]

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    
    env:
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode and Save Keystore File
      run: |
        mkdir -p app/keystore
        echo "${{ secrets.APP_RELEASE_KEY_STORE_BASE_64 }}" | base64 --decode > app/keystore/petid-release.keystore

    - name: Create local.properties
      run: |
        echo "$LOCAL_PROPERTIES" > local.properties
          
    - name: Set up keystore environment variable
      run: echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/keystore/petid-release.keystore" >> $GITHUB_ENV

    - name: Build Release AAB
      run: ./gradlew bundleOperationRelease --stacktrace --info
      env:
        KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Sign AAB
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.APP_RELEASE_KEY_STORE_BASE_64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Deploy to Google Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: com.petid.petid
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: alpha               # production, internal, alpha, beta
        status: completed
